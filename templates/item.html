<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
    <style>
        :root {
            --bg: #0a0a0a;
            --surface: #111111;
            --surface2: #1a1a1a;
            --border: rgba(255,255,255,0.08);
            --border-strong: rgba(255,255,255,0.15);
            --text: #f0f0f0;
            --text-muted: rgba(255,255,255,0.4);
            --text-dim: rgba(255,255,255,0.25);
            --accent: #e8e8e8;
            --sent-bg: #f0f0f0;
            --sent-text: #0a0a0a;
            --received-bg: #1a1a1a;
            --error: #ff4444;
            --success: #4ade80;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .shell {
            width: min(720px, 100vw);
            height: 100vh;
            display: flex;
            flex-direction: column;
            border-left: 1px solid var(--border);
            border-right: 1px solid var(--border);
        }

        .topbar {
            padding: 20px 28px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--surface2);
            border: 1px solid var(--border-strong);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 0.05em;
        }

        .topbar-name {
            font-size: 14px;
            font-weight: 500;
            letter-spacing: -0.01em;
        }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-family: 'DM Mono', monospace;
            color: var(--text-muted);
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--text-dim);
            transition: background 0.3s;
        }

        .dot.on { background: var(--success); box-shadow: 0 0 8px rgba(74,222,128,0.4); }
        .dot.off { background: var(--error); }

        .feed {
            flex: 1;
            overflow-y: auto;
            padding: 32px 28px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }

        .feed::-webkit-scrollbar { width: 4px; }
        .feed::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }

        .msg-row {
            display: flex;
            animation: rise 0.2s ease-out;
        }

        .msg-row.out { justify-content: flex-end; }
        .msg-row.in { justify-content: flex-start; }

        @keyframes rise {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .bubble {
            max-width: 68%;
            padding: 10px 14px;
            line-height: 1.55;
            font-size: 14.5px;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .msg-row.out .bubble {
            background: var(--sent-bg);
            color: var(--sent-text);
            border-radius: 16px 16px 4px 16px;
        }

        .msg-row.in .bubble {
            background: var(--received-bg);
            color: var(--text);
            border-radius: 16px 16px 16px 4px;
            border: 1px solid var(--border);
        }

        .bubble.error {
            background: rgba(255,68,68,0.08);
            color: var(--error);
            border: 1px solid rgba(255,68,68,0.2);
            border-radius: 10px;
            font-size: 13px;
            font-family: 'DM Mono', monospace;
        }

        .bubble h1, .bubble h2, .bubble h3 { font-size: 1.1em; margin: 8px 0 4px; font-weight: 600; }
        .bubble p { margin: 6px 0; }
        .bubble p:first-child { margin-top: 0; }
        .bubble p:last-child { margin-bottom: 0; }
        .bubble ul, .bubble ol { margin: 6px 0; padding-left: 20px; }
        .bubble li { margin: 2px 0; }
        .bubble code { background: rgba(255,255,255,0.1); padding: 2px 5px; border-radius: 4px; font-family: 'DM Mono', monospace; font-size: 0.9em; }
        .bubble pre { background: rgba(255,255,255,0.06); padding: 10px; border-radius: 8px; overflow-x: auto; margin: 8px 0; }
        .bubble pre code { background: none; padding: 0; }
        .bubble strong { font-weight: 600; }
        .bubble a { color: var(--success); }

        .bubble.streaming::after {
            content: '▋';
            display: inline-block;
            animation: blink 0.8s step-end infinite;
            margin-left: 2px;
            color: var(--text-muted);
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .day-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0 16px;
        }

        .day-divider span {
            font-size: 11px;
            font-family: 'DM Mono', monospace;
            color: var(--text-dim);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .day-divider::before,
        .day-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: var(--text-dim);
            pointer-events: none;
        }

        .empty-glyph {
            font-size: 28px;
            font-family: 'DM Mono', monospace;
            letter-spacing: -0.05em;
            opacity: 0.5;
        }

        .empty-label {
            font-size: 13px;
            font-family: 'DM Mono', monospace;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .composer {
            padding: 16px 20px;
            border-top: 1px solid var(--border);
            display: flex;
            align-items: flex-end;
            gap: 10px;
            flex-shrink: 0;
        }

        .input-wrap {
            flex: 1;
            background: var(--surface);
            border: 1px solid var(--border-strong);
            border-radius: 14px;
            display: flex;
            align-items: flex-end;
            padding: 10px 14px;
            transition: border-color 0.2s;
        }

        .input-wrap:focus-within {
            border-color: rgba(255,255,255,0.3);
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            resize: none;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 14.5px;
            line-height: 1.5;
            max-height: 120px;
            overflow-y: auto;
            scrollbar-width: none;
        }

        textarea::placeholder { color: var(--text-dim); }
        textarea::-webkit-scrollbar { display: none; }

        .send-btn {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            border: none;
            background: var(--accent);
            color: var(--bg);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: opacity 0.15s, transform 0.1s;
        }

        .send-btn:hover:not(:disabled) { opacity: 0.85; }
        .send-btn:active:not(:disabled) { transform: scale(0.94); }
        .send-btn:disabled { opacity: 0.25; cursor: not-allowed; }

        .send-btn svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .char-hint {
            font-size: 11px;
            font-family: 'DM Mono', monospace;
            color: var(--text-dim);
            text-align: right;
            padding: 0 4px 2px;
            flex-shrink: 0;
            width: 42px;
        }

        @media (max-width: 600px) {
            .shell { width: 100vw; border: none; }
            .topbar, .feed, .composer { padding-left: 16px; padding-right: 16px; }
            .bubble { max-width: 82%; }
        }
    </style>
</head>
<body>
<div class="shell">
    <header class="topbar">
        <div class="topbar-left">
            <div class="avatar">AI</div>
            <span class="topbar-name">Gemini</span>
        </div>
        <div class="status-pill">
            <span class="dot" id="dot"></span>
            <span id="statusLabel">bağlanıyor</span>
        </div>
    </header>

    <div class="feed" id="feed">
        <div class="empty-state" id="emptyState">
            <div class="empty-glyph">_</div>
            <div class="empty-label">Bir şeyler sor</div>
        </div>
    </div>

    <div class="composer">
        <div class="input-wrap">
            <textarea
                id="input"
                placeholder="Mesaj yaz..."
                rows="1"
                disabled
            ></textarea>
        </div>
        <span class="char-hint" id="charHint"></span>
        <button class="send-btn" id="sendBtn" disabled title="Gönder">
            <svg viewBox="0 0 24 24">
                <line x1="5" y1="12" x2="19" y2="12"/>
                <polyline points="12 5 19 12 12 19"/>
            </svg>
        </button>
    </div>
</div>

<script>
    const feed = document.getElementById('feed');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('sendBtn');
    const dot = document.getElementById('dot');
    const statusLabel = document.getElementById('statusLabel');
    const emptyState = document.getElementById('emptyState');
    const charHint = document.getElementById('charHint');

    const MAX_CHARS = 200000;
    let activeBubble = null;

    const proto = window.location.protocol === "https:" ? "wss" : "ws";
    const tokenStorageKey = "chat_access_token";
    let accessToken = window.sessionStorage.getItem(tokenStorageKey);
    if (!accessToken) {
        accessToken = window.prompt("Access token") || "";
        if (accessToken) {
            window.sessionStorage.setItem(tokenStorageKey, accessToken);
        }
    }
    const wsUrl = new URL(proto + "://" + window.location.host + "/ws");
    wsUrl.searchParams.set("token", accessToken);
    const ws = new WebSocket(wsUrl.toString());

    function setStatus(state) {
        dot.className = 'dot ' + state;
        const labels = { on: 'bağlandı', off: 'bağlantı kesildi', '': 'bağlanıyor' };
        statusLabel.textContent = labels[state] || 'bağlanıyor';
    }

    ws.onopen = () => {
        setStatus('on');
        input.disabled = false;
        sendBtn.disabled = false;
        input.focus();
    };

    ws.onclose = () => {
        setStatus('off');
        input.disabled = true;
        sendBtn.disabled = true;
    };

    ws.onerror = () => setStatus('off');

    ws.onmessage = (e) => {
        let msg;
        try {
            msg = JSON.parse(e.data);
        } catch (err) {
            console.error("Parse hatası:", e.data);
            return;
        }

        if (msg.type === "chunk") {
            if (!activeBubble) {
                hideEmpty();
                activeBubble = createBubble('in');
                activeBubble.classList.add('streaming');
                activeBubble.dataset.raw = "";
            }
            activeBubble.dataset.raw += msg.content;
            const dirty = marked.parse(activeBubble.dataset.raw);
            activeBubble.innerHTML = DOMPurify.sanitize(dirty);
            scrollDown();

        } else if (msg.type === "done") {
            finishActiveBubble();

        } else if (msg.type === "error") {
            finishActiveBubble();
            appendBubble(msg.content, 'in', true);

        } else if (msg.type === "system") {
            finishActiveBubble();
            appendBubble(msg.content, 'in', true);
        }
    };

    function createBubble(dir, isError = false) {
        const row = document.createElement('div');
        row.className = 'msg-row ' + dir;
        const b = document.createElement('div');
        b.className = 'bubble' + (isError ? ' error' : '');
        row.appendChild(b);
        feed.appendChild(row);
        scrollDown();
        return b;
    }

    function appendBubble(text, dir, isError = false) {
        const b = createBubble(dir, isError);
        b.textContent = text;
        scrollDown();
    }

    function finishActiveBubble() {
        if (activeBubble) {
            activeBubble.classList.remove('streaming');
            activeBubble = null;
        }
    }

    function hideEmpty() {
        if (emptyState) {
            emptyState.style.display = 'none';
        }
    }

    function scrollDown() {
        feed.scrollTop = feed.scrollHeight;
    }

    function autoResize() {
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 120) + 'px';
        const len = input.value.length;
        charHint.textContent = len > MAX_CHARS * 0.8 ? len + '/' + MAX_CHARS : '';
        charHint.style.color = len > MAX_CHARS ? 'var(--error)' : 'var(--text-dim)';
    }

    input.addEventListener('input', autoResize);

    input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            send();
        }
    });

    sendBtn.addEventListener('click', send);

    function send() {
        const text = input.value.trim();
        if (!text || ws.readyState !== WebSocket.OPEN) return;
        if (text.length > MAX_CHARS) return;

        finishActiveBubble();
        hideEmpty();
        appendBubble(text, 'out');

        ws.send(JSON.stringify({ type: "user_message", content: text }));

        input.value = '';
        input.style.height = 'auto';
        charHint.textContent = '';
        input.focus();
    }
</script>
</body>
</html>
