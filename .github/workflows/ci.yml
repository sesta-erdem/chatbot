name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chatbot
          POSTGRES_PASSWORD: chatbot
          POSTGRES_DB: chatbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chatbot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      # Settings validator'ları doldurulmuş olmalı (testler gerçek API/DB'ye çarpmaz)
      DATABASE_URL: postgresql+asyncpg://chatbot:chatbot@localhost:5432/chatbot
      GEMINI_API_KEY: dummy-key-for-ci
      APP_ACCESS_TOKEN: dummy-token-for-ci
      ALLOWED_ORIGINS: '["http://127.0.0.1:8000"]'
      HISTORY_TOKEN_BUDGET: "4000"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx ruff

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        run: pytest -q
